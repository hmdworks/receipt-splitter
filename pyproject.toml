[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-splitter"
version = "0.4.1"
description = "A Python CLI app for splitting receipts between people."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["receipt", "cli", "split-bill", "prompt-toolkit", "finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "prompt-toolkit>=3.0.53",
    "wcwidth>=0.8.3",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.7",
    "pytest>=9.1.1",
]

[project.scripts]
receipt-splitter = "receipt_splitter.cli:main"
